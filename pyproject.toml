[build-system]
requires = ["setuptools>=75.0,<76", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-swarm"
version = "0.1.0"
description = "Autonomous multi-agent SDLC system: issue → reviewed, tested PR"
requires-python = ">=3.14"
license = {text = "MIT"}

dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-swarm>=0.1,<1",
    "langchain>=1.3,<2",
    "langchain-core>=1.4,<2",
    "pydantic-ai>=1.102,<2",
    "pydantic>=2.6,<3",
    "openai>=2.38,<3",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "asyncpg>=0.30,<1",
    "PyGithub>=2.4,<3",
    "gitpython>=3.1,<4",
    "huggingface_hub>=1.16,<2",
    "datasets>=4.8,<5",
    "swebench>=3.0,<4",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=16.0,<17",
    "langfuse>=4.6,<5",
    "tiktoken>=0.9,<1",
    "numpy>=2.4,<3",
    "docker>=7.0,<8",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-xdist>=3.0,<4",
    "ruff>=0.6,<1",
    "mypy>=2.1,<3",
    "httpx>=0.27,<1",
    "asyncpg-stubs>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["docker", "docker.errors", "docker.models", "docker.models.containers", "docker.models.networks", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"
markers = [
    "sandbox_isolation: Tests that spin up real Docker containers for sandbox isolation verification",
    "integration: Tests that make real network calls to external services (GitHub API, etc.)",
]
