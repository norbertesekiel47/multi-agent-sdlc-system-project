# SDLC-Swarm sandbox proxy — Squid configuration
# Enforces a domain allowlist for sandbox egress.
# Allowlist domains are injected via ALLOWLIST_DOMAINS env var.

# ── Basic settings ────────────────────────────────────
http_port 3128
visible_hostname sdlc-swarm-proxy

# ── Access log ────────────────────────────────────────
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# ── Cache (minimal — we're a proxy, not a cache) ─────
cache deny all
maximum_object_size 0 KB

# ── Allowlist ACL ─────────────────────────────────────
# The allowlist_domains file is generated at startup from
# the ALLOWLIST_DOMAINS env var by entrypoint.sh.
acl allowlist_domains dstdomain "/etc/squid/allowlist_domains.txt"

# ── Access rules ──────────────────────────────────────
# Allow only allowlisted domains, deny everything else
http_access allow allowlist_domains
http_access deny all

# ── Deny info ─────────────────────────────────────────
deny_info TCP_DENIED %R

# ── Timeout settings ──────────────────────────────────
connect_timeout 30 seconds
read_timeout 60 seconds

# ── DNS ───────────────────────────────────────────────
# Don't cache DNS — let the host resolve
dns_timeout 10 seconds
