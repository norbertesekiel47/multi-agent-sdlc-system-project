name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint · typecheck · test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sdlc_swarm
          POSTGRES_PASSWORD: sdlc_swarm_dev
          POSTGRES_DB: sdlc_swarm
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sdlc_swarm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Mocked unit tests never call these services, but agent modules
      # construct provider clients at import time and require the keys to
      # exist. Real-call tests are marked `integration` and excluded here.
      OPENROUTER_API_KEY: sk-or-ci-dummy
      OPENAI_API_KEY: sk-ci-dummy
      GITHUB_PAT: ci-dummy
      GITHUB_USERNAME: ci-dummy
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_USER: sdlc_swarm
      POSTGRES_PASSWORD: sdlc_swarm_dev
      POSTGRES_DB: sdlc_swarm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database schema
        run: python -m src.db.init_schema

      - name: Ruff
        run: ruff check src tests

      - name: Mypy (strict)
        run: mypy --strict src

      - name: Pytest (non-integration, no-infra)
        # Excludes suites that need infrastructure not present on the runner:
        #   - sandbox/ : custom sdlc-swarm Docker images (built by init.sh)
        #   - packaging/test_kitops : the `kit` CLI binary
        #   - memory/test_semantic_store : a real OpenAI embeddings key
        #   - evals/test_promptfoo_ci : fnm + node-22 + promptfoo
        #   - TestPromptfooCIPaths : reads a hard-coded absolute local path
        #   - TestSecretRedactionInSpans : needs real (long) secret values
        # These are exercised locally/in integration runs, not in unit CI.
        run: >-
          pytest -q -m "not integration" -p no:cacheprovider
          --cov=src --cov-report=term-missing
          --ignore=tests/sandbox/test_isolation.py
          --ignore=tests/sandbox/test_apply_diff.py
          --ignore=tests/packaging/test_kitops.py
          --ignore=tests/memory/test_semantic_store.py
          --ignore=tests/evals/test_promptfoo_ci.py
          --deselect tests/orchestrator/test_scrutiny_wiring.py::TestPromptfooCIPaths
          --deselect tests/test_backend_tracing.py::TestSecretRedactionInSpans

  web:
    name: Web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build
